name: nba-daily-refresh

on:
  schedule:
    # Runs at both 16:00 and 17:00 UTC, then filters to exactly noon ET in-step.
    - cron: "0 16,17 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional ET date to publish (YYYY-MM-DD). Leave blank for all upcoming games."
        required: false
        type: string
      target_timezone:
        description: "Timezone used for target_date filtering."
        required: false
        default: "America/New_York"
        type: string

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check noon ET window
        id: noon_check
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          import pytz
          import os
          now_et = datetime.now(pytz.timezone("America/New_York"))
          print(f"Current ET time: {now_et}")
          output_path = os.environ["GITHUB_OUTPUT"]
          if now_et.hour != 12:
              print("Not noon ET. Marking run as skipped.")
              with open(output_path, "a", encoding="utf-8") as f:
                  f.write("run_refresh=false\n")
          else:
              print("Noon ET confirmed.")
              with open(output_path, "a", encoding="utf-8") as f:
                  f.write("run_refresh=true\n")
          PY

      - name: Generate model predictions
        if: github.event_name != 'schedule' || steps.noon_check.outputs.run_refresh == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          MODEL_PATH: /tmp/model_artifact.joblib
          PREDICTIONS_PATH: data/latest_predictions.json
          LOOKBACK_SEASONS: "5"
          MIN_EDGE_PCT: "2.0"
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          TARGET_TIMEZONE: ${{ github.event.inputs.target_timezone || 'America/New_York' }}
        run: |
          if [ -z "${ODDS_API_KEY}" ] && [ -z "${THE_ODDS_API_KEY}" ] && [ -z "${ODDSAPI_KEY}" ]; then
            echo "No Odds API key secret found. Set ODDS_API_KEY (preferred), THE_ODDS_API_KEY, or ODDSAPI_KEY."
            exit 1
          fi
          python scripts/daily_refresh.py

      - name: Commit refreshed data
        if: github.event_name != 'schedule' || steps.noon_check.outputs.run_refresh == 'true'
        run: |
          if [ ! -f data/latest_predictions.json ] || [ ! -f data/latest_summary.json ]; then
            echo "Expected prediction output files were not generated."
            exit 1
          fi
          if [ ! -f data/picks_history.json ]; then
            echo "[]" > data/picks_history.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_predictions.json data/latest_summary.json data/picks_history.json
          if git diff --cached --quiet; then
            echo "No prediction file changes."
            exit 0
          fi
          git commit -m "chore: refresh nba model predictions"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
          git push

      - name: Post picks to Discord
        if: github.event_name != 'schedule' || steps.noon_check.outputs.run_refresh == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PREDICTIONS_PATH: data/latest_predictions.json
        run: python scripts/post_to_discord.py
